seed_everything: false
eval_after_fit: true
trainer:
  accelerator: auto
  devices: 1
  precision: 16-mixed
  max_epochs: 50
  logger:
    class_path: lightning.pytorch.loggers.MLFlowLogger
    init_args:
      experiment_name: standard
      tracking_uri: sqlite:///logs/olive-oil/inception-time
  callbacks:
    - class_path: torch_uncertainty.callbacks.TUClsCheckpoint
routine:
  model:
    class_path: torch_uncertainty.models.classification.inception_time
    init_args:
      in_channels: 1
      num_classes: 3
  num_classes: 3
  loss: CrossEntropyLoss
  save_to_csv: true
data:
  dataset_name: OliveOil
  batch_size: 16
  num_workers: 4
  eval_ood: true
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 1e-2
lr_scheduler:
  class_path: torch.optim.lr_scheduler.CosineAnnealingLR
  init_args:
    T_max: 10
