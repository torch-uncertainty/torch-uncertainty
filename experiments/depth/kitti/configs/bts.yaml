# lightning.pytorch==2.2.0
eval_after_fit: true
seed_everything: false
trainer:
  accelerator: auto
  devices: 1
  precision: 16-mixed
  max_epochs: 50
  logger:
    class_path: lightning.pytorch.loggers.MLFlowLogger
    init_args:
      experiment_name: standard
      tracking_uri: sqlite:///logs/bts
  callbacks:
    - class_path: lightning.pytorch.callbacks.ModelCheckpoint
      init_args:
        monitor: val/reg/SILog
        mode: min
        save_last: true
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
routine:
  model:
    class_path: torch_uncertainty.models.depth.bts_resnet
    init_args:
      arch: 50
      max_depth: 80.0
      pretrained_backbone: true
  loss:
    class_path: torch_uncertainty.metrics.SILog
    init_args:
      sqrt: true  
data:
  root: ./data
  batch_size: 4
  crop_size:
    - 352
    - 704
  eval_size:
    - 352
    - 1216
  num_workers: 4
optimizer:
  class_path: torch.optim.AdamW
  init_args:
    lr: 1e-4
lr_scheduler:
  class_path: torch.optim.lr_scheduler.PolynomialLR
  init_args:
    power: 0.9
    total_iters: 50
