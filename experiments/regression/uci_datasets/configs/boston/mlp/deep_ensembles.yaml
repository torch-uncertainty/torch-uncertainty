# lightning.pytorch==2.1.3
seed_everything: false
eval_after_fit: true
trainer:
  accelerator: auto
  devices: 1
  precision: 16-mixed
  max_epochs: 40
  logger:
    class_path: lightning.pytorch.loggers.MLFlowLogger
    init_args:
      experiment_name: deep_ensembles
      tracking_uri: sqlite:///logs/boston/mlp/normal
  callbacks:
    - class_path: torch_uncertainty.callbacks.TURegCheckpoint
      init_args:
        probabilistic: true
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/reg/MSE
        patience: 1000
        check_finite: true
routine:
  model:
    class_path: torch_uncertainty.models.deep_ensembles
    init_args:
      models:
        class_path: torch_uncertainty.models.mlp.mlp
        init_args:
          in_features: 13
          num_outputs: 1
          hidden_dims:
            - 50
          dist_family: normal
      num_estimators: 5
      task: regression
      probabilistic: true
  output_dim: 1
  loss: torch_uncertainty.losses.DistributionNLLLoss
  dist_family: normal
  save_to_csv: true
  format_batch_fn:
    class_path: torch_uncertainty.transforms.RepeatTarget
    init_args:
      num_repeats: 5
data:
  root: ./data
  batch_size: 128
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 5e-3
    weight_decay: 0
