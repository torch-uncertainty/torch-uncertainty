# lightning.pytorch==2.1.3
seed_everything: false
eval_after_fit: true
trainer:
  accelerator: auto
  devices: 1
  precision: 16-mixed
  max_epochs: 40
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      save_dir: logs/boston/mlp/point_wise
      name: standard
  callbacks:
    - class_path: torch_uncertainty.callbacks.TURegCheckpoint
    - class_path: lightning.pytorch.callbacks.LearningRateMonitor
      init_args:
        logging_interval: step
    - class_path: lightning.pytorch.callbacks.EarlyStopping
      init_args:
        monitor: val/reg/MSE
        patience: 1000
        check_finite: true
routine:
  model:
    class_path: torch_uncertainty.models.mlp.mlp
    init_args:
      in_features: 13
      num_outputs: 1
      hidden_dims:
        - 50
  output_dim: 1
  loss: MSELoss
  save_to_csv: true
data:
  root: ./data
  batch_size: 128
  dataset_name: boston
optimizer:
  class_path: torch.optim.Adam
  init_args:
    lr: 5e-3
    weight_decay: 0
